<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case Look-Up has moved — Justice Connection</title>
<link rel="icon" href="assets/JusticeConnection_Icon_Black.png" type="image/png">
<!--
  L-068 / L-075 — redirect stub, 2026-09-01.
  This page used to be a second, older Case Look-Up app. It range-read the same two
  Parquets as the canonical app under a URL that carried no cache key, so a visitor
  here could mix stale and fresh byte ranges after a Parquet promotion and hit a ZSTD
  decompression failure. It is retired by redirect rather than deleted so that
  bookmarked/shared URLs and any Framer iframe embed keep working (there is no
  404.html in the Pages clone).
  DO NOT add a script, a stylesheet, a Parquet fetch or DuckDB-WASM to this file.
  With no Parquet read here, the second BUILD constant no longer exists and
  invariant 11 governs two constants, not three.
-->
<link rel="canonical" href="https://justiceconnection.github.io/lions-data-dashboards/case-lookup/index.html">
<meta http-equiv="refresh" content="3;url=./case-lookup/index.html">
<style>
  :root{ --bg:#fbfbfb; --ink:#212123; --muted:#6b6b70; --line:#dcdce0; --accent:#eaf54c; --card:#fff; }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
  .wrap{padding:16px 20px;max-width:1440px;margin:0 auto}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px 24px;margin:24px 0;max-width:620px}
  h1{font-size:20px;margin:0 0 10px}
  p{margin:0 0 14px}
  .muted{font-size:12px;color:var(--muted);margin:0}
  a.go{display:inline-block;text-decoration:none;font-weight:600;color:var(--ink);
       background:var(--accent);border:1px solid #c3cc00;border-radius:8px;padding:9px 18px}
  a.go:hover{opacity:.88}
  a.go:focus{outline:2px solid var(--ink);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <h1>The Case Look-Up tool has moved</h1>
    <p>It now lives at <b>case-lookup/</b>. You will be taken there automatically in a
       few seconds — or open it now:</p>
    <p><a class="go" href="./case-lookup/index.html">Open Case Look-Up</a></p>
    <p class="muted">Please update any bookmarks or links that point at this address.</p>
  </div>
</div>
</body>
</html>
